[General]
language=RU
tooltips=true

[tabs]
modelSettings=true
graph=true
adjMatrix=true
staticAnalysis=true
simulation=true
experiments=true
sensitivity=true

[database]
path=models.db

[help]
baseDir=help

[ui]
style=Fusion
disableDarkMode=true
globalStyleSheet=QLineEdit, QTextEdit, QListWidget {\nborder: 1px solid palette(mid);\n}

[simulation]
baseStepTimeMs=1000
speedUpFactor=2
slowDownFactor=2
progressUpdateTimeMs=200
unfinishedProgressThreshold=15
progressMaxStep=10000000

[sensitivity]
defaultMaxChange=0.1
changeSteps=10
maxIterations=1000

[graph]
panSensitivity=2
zoomFactor=1.15
