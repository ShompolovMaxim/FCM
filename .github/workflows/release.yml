name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.release.tag_name }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          tools: 'tools_mingw1310'
          cache: 'true'

      - name: Configure CMake
        run: cmake -S . -B ci-build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build ci-build --parallel

      - name: Run tests
        run: ctest --test-dir ci-build --build-config Release --output-on-failure

      - name: Prepare distributable package
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item ci-build/FCM.exe dist/FCM.exe
          if (Test-Path ci-build/help) {
            Copy-Item ci-build/help dist/help -Recurse
          }
          windeployqt --release --dir dist dist/FCM.exe

      - name: Create release archive
        if: success()
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath FCM-build-${{ github.event.release.tag_name }}.zip -Force

      - name: Attach archive to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: FCM-build-${{ github.event.release.tag_name }}.zip
          fail_on_unmatched_files: true
